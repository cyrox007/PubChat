name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chat_ci
          POSTGRES_USER: pubchat
          POSTGRES_PASSWORD: ci-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pubchat -d chat_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      JWT_ACCESS_SECRET_KEY: ci-access-secret-value-at-least-32-characters-long
      JWT_REFRESH_SECRET_KEY: ci-refresh-secret-value-at-least-32-characters-long
      CSRF_SECRET_KEY: ci-csrf-secret-value-at-least-32-characters-long
      DEBUG: "True"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: chat_ci
      DB_USER: pubchat
      DB_PASSWORD: ci-db-password
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q .
      - name: Import FastAPI application
        run: python -c "from app import app; assert app.title == 'PubChat API'"
      - name: Realtime security regression guard
        run: |
          python - <<'PY'
          from pathlib import Path
          offenders = []
          for path in Path('.').rglob('*.py'):
              text = path.read_text(encoding='utf-8')
              if '{token}' in text and 'websocket' in text.lower():
                  offenders.append(str(path))
          if offenders:
              raise SystemExit(f'Credential-like WebSocket URL found: {offenders}')
          PY
      - name: Check Alembic migration head
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic heads
      - name: Rehearse migrations on clean PostgreSQL
        run: |
          alembic upgrade head
          alembic current | grep '(head)'
      - name: Check model and migration schema drift
        run: alembic check
      - name: Run backend contract tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check external delivery observability CLI
        run: python -m workers.external_delivery_observability --window-hours 24 --require-healthy
      - name: Check moderation storage retention preflight
        env:
          MODERATION_MEDIA_BACKUP_RETENTION_DAYS: "90"
          MODERATION_MEDIA_SNAPSHOT_RETENTION_DAYS: "30"
        run: bash ../ops/check-moderation-storage-lifecycle.sh
      - name: Run PostgreSQL integration smoke
        env:
          PUBCHAT_POSTGRES_INTEGRATION: "1"
        run: python -m unittest tests.test_postgres_integration
      - name: Run Redis realtime integration smoke
        env:
          PUBCHAT_REDIS_INTEGRATION: "1"
        run: python -m unittest tests.test_redis_realtime_integration
      - name: Profile realtime Redis pool near configured limit
        env:
          REDIS_MAX_CONNECTIONS: "12"
          REDIS_POOL_ALERT_UTILIZATION_PERCENT: "90"
          REDIS_POOL_MIN_HEADROOM_CONNECTIONS: "1"
          PUBCHAT_REDIS_POOL_PROFILE_INTEGRATION: "1"
        run: |
          python -m unittest tests.test_realtime_pool_profile_redis_integration
          python -m workers.realtime_pool_profile \
            --operations 120 \
            --concurrency 10 \
            --max-error-rate-percent 0 \
            --max-p95-ms 2000 \
            --max-saturation-samples 0 \
            --require-healthy
      - name: Drill Redis restart and realtime recovery
        run: |
          REDIS_CONTAINER_ID="$(docker ps --filter 'ancestor=redis:7.2-alpine' --format '{{.ID}}' | head -n 1)"
          test -n "$REDIS_CONTAINER_ID"
          PUBCHAT_REDIS_RECOVERY_INTEGRATION=1 \
            PUBCHAT_REDIS_CONTAINER_ID="$REDIS_CONTAINER_ID" \
            python -m unittest tests.test_redis_recovery_integration
      - name: Drill Redis Sentinel master promotion and recovery
        run: bash tests/run_redis_sentinel_failover.sh
      - name: Rehearse multi-process WebSocket rolling restart
        env:
          PUBCHAT_REALTIME_MULTIPROCESS_INTEGRATION: "1"
        run: python -m unittest tests.test_realtime_multiprocess_integration
      - name: Rehearse production rolling reload without HTTP outage
        env:
          PUBCHAT_PRODUCTION_RELOAD_INTEGRATION: "1"
        run: python -m unittest tests.test_production_reload_integration
      - name: Rehearse revival migrations with legacy data
        env:
          PUBCHAT_LEGACY_DB_NAME: chat_legacy_ci
        run: |
          python tests/legacy_migration_fixture.py create-db
          DB_NAME=chat_legacy_ci alembic upgrade 4f3d66790cd3
          python tests/legacy_migration_fixture.py seed
          DB_NAME=chat_legacy_ci alembic upgrade head
          DB_NAME=chat_legacy_ci alembic current | grep '(head)'
          DB_NAME=chat_legacy_ci alembic check
          PUBCHAT_LEGACY_MIGRATION_INTEGRATION=1 python -m unittest tests.test_legacy_migration_integration
      - name: Drill PostgreSQL backup and restore
        env:
          PUBCHAT_SOURCE_DB_NAME: chat_legacy_ci
          PUBCHAT_RESTORE_DB_NAME: chat_restore_ci
        run: |
          PUBCHAT_LEGACY_DB_NAME="$PUBCHAT_RESTORE_DB_NAME" python tests/legacy_migration_fixture.py create-db
          docker run --rm --network host \
            -e PGPASSWORD="$DB_PASSWORD" \
            postgres:16 \
            pg_dump \
              --host "$DB_HOST" \
              --port "$DB_PORT" \
              --username "$DB_USER" \
              --format=custom \
              --no-owner \
              --no-privileges \
              "$PUBCHAT_SOURCE_DB_NAME" > /tmp/pubchat-recovery.dump
          test -s /tmp/pubchat-recovery.dump
          docker run --rm -i --network host \
            -e PGPASSWORD="$DB_PASSWORD" \
            postgres:16 \
            pg_restore \
              --host "$DB_HOST" \
              --port "$DB_PORT" \
              --username "$DB_USER" \
              --dbname "$PUBCHAT_RESTORE_DB_NAME" \
              --no-owner \
              --no-privileges < /tmp/pubchat-recovery.dump
          DB_NAME="$PUBCHAT_RESTORE_DB_NAME" alembic current | grep '(head)'
          DB_NAME="$PUBCHAT_RESTORE_DB_NAME" alembic check
          PUBCHAT_LEGACY_DB_NAME="$PUBCHAT_RESTORE_DB_NAME" \
            PUBCHAT_LEGACY_MIGRATION_INTEGRATION=1 \
            python -m unittest tests.test_legacy_migration_integration
          rm -f /tmp/pubchat-recovery.dump

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: SPA security regression guard
        run: |
          if grep -R "setItem('access_token'" -n src; then
            echo "Persistent access token write detected"
            exit 1
          fi
          if grep -R 'setItem("access_token"' -n src; then
            echo "Persistent access token write detected"
            exit 1
          fi
          if grep -R '/ws/.*token' -n src; then
            echo "Credential-like WebSocket URL detected"
            exit 1
          fi
          if grep -R 'http://localhost:9000' -n src; then
            echo "Cross-origin localhost API fallback detected; browser default must be same-origin /api"
            exit 1
          fi
      - name: PWA cache safety guard
        run: npm run check:pwa
      - name: App lifecycle regression guard
        run: npm run check:lifecycle
      - name: Build frontend
        run: npm run build


  browser-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chat_browser_ci
          POSTGRES_USER: pubchat
          POSTGRES_PASSWORD: ci-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pubchat -d chat_browser_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_ACCESS_SECRET_KEY: ci-browser-access-secret-value-at-least-32-characters
      JWT_REFRESH_SECRET_KEY: ci-browser-refresh-secret-value-at-least-32-characters
      CSRF_SECRET_KEY: ci-browser-csrf-secret-value-at-least-32-characters
      DEBUG: "True"
      FRONTEND_URL: http://127.0.0.1:4173
      SERVER_HTTP_PROTOCOL: http://
      SERVER_ADDR: 127.0.0.1
      SERVER_PORT: "9000"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: chat_browser_ci
      DB_USER: pubchat
      DB_PASSWORD: ci-db-password
      REDIS_URL: redis://127.0.0.1:6379/0
      VITE_API_BASE_URL: /api
      VITE_API_WS_SERVER_URL: ""
      PUBCHAT_DEV_BACKEND: http://127.0.0.1:9000
      PUBCHAT_BROWSER_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and frontend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install browser engines
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Prepare browser database
        working-directory: backend
        run: alembic upgrade head
      - name: Build production-like SPA
        working-directory: frontend
        run: npm run build
      - name: Start same-origin browser stack
        run: |
          (
            cd backend
            nohup python -m uvicorn app:app --host 127.0.0.1 --port 9000 >/tmp/pubchat-browser-backend.log 2>&1 &
            echo $! >/tmp/pubchat-browser-backend.pid
          )
          (
            cd frontend
            nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/pubchat-browser-frontend.log 2>&1 &
            echo $! >/tmp/pubchat-browser-frontend.pid
          )
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/health/ready >/dev/null               && curl --fail --silent http://127.0.0.1:4173/registration >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Browser stack did not become ready"
          cat /tmp/pubchat-browser-backend.log || true
          cat /tmp/pubchat-browser-frontend.log || true
          exit 1
      - name: Run Chromium Firefox WebKit and mobile auth/session smoke
        working-directory: frontend
        run: npx playwright test --config=playwright.config.mjs
      - name: Print browser stack logs on failure
        if: failure()
        run: |
          echo "=== backend ==="
          tail -n 200 /tmp/pubchat-browser-backend.log || true
          echo "=== frontend ==="
          tail -n 200 /tmp/pubchat-browser-frontend.log || true



  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Audit production frontend dependencies
        id: npm_audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Install pinned Python audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit backend dependencies
        id: pip_audit
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt --progress-spinner off
      - name: Enforce dependency security gate
        if: always()
        run: |
          echo "npm audit outcome: ${{ steps.npm_audit.outcome }}"
          echo "pip-audit outcome: ${{ steps.pip_audit.outcome }}"
          if [[ "${{ steps.npm_audit.outcome }}" != "success" || "${{ steps.pip_audit.outcome }}" != "success" ]]; then
            echo "Production dependency vulnerability gate failed"
            exit 1
          fi
